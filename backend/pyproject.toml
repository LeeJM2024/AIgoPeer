[project]
name = "algopeer-backend"
version = "0.1.0"
description = "AlgoPeer FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "certifi>=2026.10.19",
  "httpx>=0.28,<1",
  "alembic>=1.14,<2",
  "docker>=7,<8",
  "fastapi>=0.162,<0.163",
  "starlette>=1.3.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.32,<1",
  "Pillow>=13,<14",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<6",
  "scipy>=1.15,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=9.0.3,<10", "ruff>=0.8,<1", "pip-audit>=2.10,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection intentionally uses Depends in defaults.
