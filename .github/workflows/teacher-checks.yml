name: Teacher workflow checks

on:
  push:
    branches: [teacher, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teacher_ci
          POSTGRES_USER: teacher_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher_ci -d teacher_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teacher_ci:isolated-ci-only@127.0.0.1:5432/teacher_ci
      RUN_BROWSER_TESTS: '1'
      JWT_SECRET: isolated-ci-signing-key-never-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e './backend[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: python -m ruff check backend tests
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest tests/backend -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: teacher-browser-diagnostics
          path: |
            storage/qa/*.png
            storage/qa/browser-server.log
