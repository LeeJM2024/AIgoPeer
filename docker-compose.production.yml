# Standalone production configuration: docker compose -f docker-compose.production.yml up -d --build
name: algopeer-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000']
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db and URL-encoded credentials}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set an independent strong JWT secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set a separate internal service secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the frontend HTTPS origin}
      AI_VIDEO_PROVIDER: ${AI_VIDEO_PROVIDER:-}
      AI_VIDEO_API_KEY: ${AI_VIDEO_API_KEY:-}
      AI_VIDEO_BASE_URL: ${AI_VIDEO_BASE_URL:-}
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-}
      AI_VIDEO_ENABLED: ${AI_VIDEO_ENABLED:-false}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  production-postgres:
