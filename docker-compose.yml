name: algopeer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algopeer}
      POSTGRES_USER: ${POSTGRES_USER:-algopeer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-demo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://algopeer:change-me-before-demo@db:5432/algopeer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./algorithm:/app/algorithm
      - ./storage:/app/storage
      - ./tests:/tests:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge-image:
    image: algopeer-judge-cpp:latest
    build:
      context: .
      dockerfile: backend/judge/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    command: ["sh", "-c", "true"]

  judge-worker:
    build:
      context: .
      dockerfile: backend/judge-worker.Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://algopeer:change-me-before-demo@db:5432/algopeer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JUDGE_QUEUE_NAME: ${JUDGE_QUEUE_NAME:-algopeer:judge:queue}
      JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-1}
      JUDGE_WORK_VOLUME: ${JUDGE_WORK_VOLUME:-algopeer-judge-work}
      JUDGE_WORK_DIR: /judge-work
      JUDGE_IMAGE: ${JUDGE_IMAGE:-algopeer-judge-cpp:latest}
      JUDGE_SOURCE_LIMIT_BYTES: ${JUDGE_SOURCE_LIMIT_BYTES:-65536}
      JUDGE_TOTAL_TIME_LIMIT_MS: ${JUDGE_TOTAL_TIME_LIMIT_MS:-10000}
      JUDGE_OUTPUT_LIMIT_BYTES: ${JUDGE_OUTPUT_LIMIT_BYTES:-1048576}
      JUDGE_COMPILER_OUTPUT_LIMIT_BYTES: ${JUDGE_COMPILER_OUTPUT_LIMIT_BYTES:-4096}
    volumes:
      - ./backend:/app
      - judge-work:/judge-work
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-image:
        condition: service_completed_successfully

volumes:
  postgres-data:
  judge-work:
    name: algopeer-judge-work
